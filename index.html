<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#eef3fb" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b1020" />
    <meta name="description" content="Clima is a fast, accessible weather dashboard: current conditions, a 24-hour chart and a 5-day forecast for any city, powered by OpenWeather." />
    <meta property="og:title" content="Clima · Weather, beautifully" />
    <meta property="og:description" content="Current conditions, hourly chart and 5-day forecast for any city. Accessible, responsive, light and dark." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://api.openweathermap.org" crossorigin />
    <title>Clima · Weather, beautifully</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = JSON.parse(localStorage.getItem('clima:theme') || '"system"')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Clima needs JavaScript to fetch live weather data.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
